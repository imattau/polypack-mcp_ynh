#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "polypack_mcp"
name = "Polypack MCP"
description.en = "Local persistent memory service for MCP clients and YunoHost MCP"
description.fr = "Service local de mémoire persistante pour les clients MCP et YunoHost MCP"

version = "0.1.27~ynh1"
maintainers = ["imattau"]

[upstream]
license = "MIT"
code = "https://github.com/imattau/polypack-mcp"
admindoc = "https://github.com/imattau/polypack-mcp/blob/master/README.md"

[integration]
yunohost = ">= 12.0"
helpers_version = "2.1"
# polypack-db currently requires a native Linux wheel validation pass. Start
# with amd64 until arm64/armhf builds are verified.
architectures = ["amd64"]
multi_instance = false
ldap = "not_relevant"
sso = "not_relevant"
disk = "500M"
ram.build = "1G"
ram.runtime = "256M"

[install]
# This is a local infrastructure service: it has no domain, path, browser
# permission, or interactive install question.

[resources]
    [resources.sources.main]
    url = "https://github.com/imattau/polypack-mcp/archive/refs/tags/v0.1.27.tar.gz"
    sha256 = "79fac349801e800d217460ffcb048fc00053c02a952745fc0f32b3451fd4bce1"
    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.ports.main]
    default = 8765
    exposed = false

    [resources.apt]
    packages = "python3-venv, python3-dev, build-essential, ca-certificates"
